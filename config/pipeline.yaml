# Pipeline settings. Paths are relative to the repo root.
lake_root: data/lake
warehouse: data/warehouse.duckdb

api:
  page_size: 10000        # OpenFEMA per-request maximum
  max_retries: 5
  backoff_seconds: 2      # exponential: 2, 4, 8, 16
  timeout_seconds: 120

duckdb:
  memory_limit: 8GB       # lower this on a 16 GB machine if other things are running
  threads: 4
  temp_directory: data/tmp   # spill location for the policies aggregation

panel:
  year_min: 2009          # policy records start in 2009; 2009 exposure is partial (warm-up only)
  year_max: null          # null = current year

datasets:
  nfip_claims:
    entity: NfipClaims    # v3; v2 (FimaNfipClaims) was retired 2026-10-15
    version: 3
    source: api
    partition_field: state
    enabled: true

  nfip_community_status_book:
    entity: NfipCommunityStatusBook   # CRS entry date and current class per community
    version: 1
    source: api
    key_field: communityIdNumber
    enabled: true

  nfip_policies:
    entity: NfipPolicies  # about 75M rows: bulk Parquet, not the API
    version: 3
    source: bulk
    url: https://www.fema.gov/about/reports-and-data/openfema/v3/NfipPoliciesV3.parquet
    enabled: true

# "all" = 50 states, DC, and NFIP territories. Or a list, e.g. [NC, SC, VA].
states: all
