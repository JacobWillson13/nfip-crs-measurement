# Databricks Asset Bundle: the NFIP pipeline's gold, quality, and analysis layers on
# Databricks serverless (Free Edition works). Setup and run steps: databricks/README.md.
#
#   databricks bundle validate
#   databricks bundle deploy
#   databricks bundle run nfip_pipeline
#
# The bundle syncs this repo (minus .gitignore'd files such as data/) to the workspace,
# so the notebooks import the same pipeline/ and analysis/ code that runs locally.

bundle:
  name: nfip-crs-measurement

variables:
  catalog:
    description: Unity Catalog catalog (Free Edition creates "workspace")
    default: workspace
  schema:
    description: Schema holding every table, with layer prefixes (silver_, gold_, ops_, results_)
    default: nfip

resources:
  jobs:
    nfip_pipeline:
      name: nfip-crs-pipeline
      description: Landing files -> silver Delta -> gold (shared SQL) -> quality checks -> analysis and MLflow
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      # Monthly, after OpenFEMA's refresh; paused until the landing files are refreshed by
      # the local pipeline (python -m pipeline.cli export, then databricks/upload.sh).
      schedule:
        quartz_cron_expression: "0 0 7 5 * ?"
        timezone_id: America/New_York
        pause_status: PAUSED
      max_concurrent_runs: 1
      tasks:
        - task_key: load_silver
          notebook_task:
            notebook_path: ./databricks/notebooks/01_load_silver.py
        - task_key: build_gold
          depends_on:
            - task_key: load_silver
          notebook_task:
            notebook_path: ./databricks/notebooks/02_build_gold.py
        - task_key: quality
          depends_on:
            - task_key: build_gold
          notebook_task:
            notebook_path: ./databricks/notebooks/03_quality.py
        - task_key: analysis
          depends_on:
            - task_key: quality
          notebook_task:
            notebook_path: ./databricks/notebooks/04_analysis.py

targets:
  dev:
    mode: development
    default: true
