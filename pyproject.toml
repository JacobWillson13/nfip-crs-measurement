[project]
name = "nfip-crs-measurement"
version = "0.2.0"
description = "OpenFEMA NFIP pipeline: claims, policies, and CRS status into a national community-year panel"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=15",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# Spark parity test (tests/test_spark_parity.py); needs Java 17+.
spark = ["pyspark>=4.0", "pandas>=2.2"]
analysis = ["pandas>=2.2", "pyfixest>=0.30", "scipy>=1.11", "matplotlib>=3.8", "openpyxl>=3.1", "jupyter"]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.setuptools.package-data]
"pipeline.transform" = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks: spark, dbutils, and display are provided by the runtime.
"databricks/notebooks/*.py" = ["F821", "E402"]
