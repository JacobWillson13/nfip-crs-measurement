[project]
name = "nfip-crs-measurement"
version = "0.1.0"
description = "OpenFEMA NFIP claims pipeline and community-year panel for evaluating FEMA's Community Rating System"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=15",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
analysis = ["pandas>=2.2", "statsmodels>=0.14", "jupyter"]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.setuptools.package-data]
"pipeline.transform" = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
